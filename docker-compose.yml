services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dpdpa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpdpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dpdpa_reviewer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpdpa} -d ${POSTGRES_DB:-dpdpa_reviewer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dpdpa_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dpdpa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dpdpa_reviewer}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: dpdpa_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
