<h1>Create your account</h1>
<p>Join in under a minute and start shopping.</p>

<form method="POST" action="/signup">
  <label for="full_name">Full name</label>
  <input type="text" id="full_name" name="full_name" required />

  <label for="email">Email address</label>
  <input type="email" id="email" name="email" required />

  <label for="phone_number">Mobile number</label>
  <input type="tel" id="phone_number" name="phone_number" required />

  <label for="address_line">Delivery address</label>
  <input type="text" id="address_line" name="address_line" required />

  <label for="date_of_birth">Date of birth</label>
  <input type="date" id="date_of_birth" name="date_of_birth" required />

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required />

  <label for="support_pin">Support PIN</label>
  <input type="password" id="support_pin" name="support_pin" required />

  <div class="consent">
    <label for="consent_all" style="font-weight: 400">
      <input type="checkbox" id="consent_all" name="consent_all" checked />
      I agree that Bharat Bazaar and its partners may collect, store, process,
      analyse and share my personal data, including identity documents, for any
      purpose the company considers useful, for as long as the company considers
      useful.
    </label>
  </div>

  <button type="submit">Create account</button>
</form>
{% endblock %}
